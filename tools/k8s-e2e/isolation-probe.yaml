# Pod with the labels of an algorithm pod, to check that the NetworkPolicies only
# allow algorithms to reach the node proxy (and DNS)
apiVersion: v1
kind: Pod
metadata:
  name: e2e-isolation-probe
  labels:
    app.kubernetes.io/managed-by: vantage6-node
    app.kubernetes.io/component: algorithm
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - |
          check() {
            if wget -q -T 5 -O /dev/null "$2" 2>/dev/null; then r=reachable; else r=blocked; fi
            echo "$1 $r"
          }
          check proxy http://node-vantage6-node-proxy.v6.svc:8080/version
          check server http://v6-e2e-server/api/version
          check internet http://example.com
