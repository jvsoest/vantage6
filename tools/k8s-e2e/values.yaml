# Helm values for the end-to-end test node
image:
  repository: vantage6-node
  tag: e2e
  pullPolicy: Never
node:
  serverUrl: http://v6-e2e-server
  port: 80
  apiPath: /api
  apiKey: 11111111-1111-4111-8111-111111111111
  databases:
    - label: default
      type: csv
      uri: data.csv
      mount_mode: ro
      volume:
        claim_name: e2e-data
    - label: copied
      type: csv
      uri: data.csv
      volume:
        claim_name: e2e-data
  policies:
    allowed_algorithms:
      - ghcr.io/vantage6/algorithm/demo/average
  logging:
    level: DEBUG
taskVolume:
  # kind only provides ReadWriteOnce volumes, so this also tests that algorithm
  # pods are co-located with the node pod
  accessMode: ReadWriteOnce
  size: 1Gi
