# Research data for the end-to-end test: a claim with a csv file
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: e2e-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-data-writer
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - printf 'id,age\n1,20\n2,30\n3,40\n' > /data/data.csv && chmod 644 /data/data.csv
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: e2e-data
