# Service account of the node, allowed to manage the jobs of algorithm runs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "node.fullname" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
{{- if .Values.algorithms.serviceAccount.create }}
---
# Service account of the algorithm pods, without any permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "node.algorithmServiceAccountName" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
