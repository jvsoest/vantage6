{{- if not .Values.node.existingConfigSecret }}
{{- if not .Values.node.serverUrl }}
{{- fail "node.serverUrl is required" }}
{{- end }}
{{- if not .Values.node.apiKey }}
{{- fail "node.apiKey is required (or provide node.existingConfigSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node.configSecretName" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "node.config" . | nindent 4 }}
{{- end }}
