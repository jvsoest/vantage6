{{- if .Values.networkPolicy.enabled }}
{{- $openshift := eq (include "node.openshift" .) "true" }}
# Algorithm pods are isolated: no incoming traffic, and outgoing traffic only to
# the node proxy, DNS and explicitly allowed services (algorithms.egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "node.fullname" . }}-algorithms
  labels:
    {{- include "node.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "node.algorithmSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "node.podSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.port }}
    - to:
        {{- if $openshift }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        {{- else }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        {{- toYaml .Values.networkPolicy.dns.ports | nindent 8 }}
        {{- end }}
    {{- with .Values.algorithms.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# The node proxy only accepts traffic from the algorithm pods. The node itself
# needs to reach the vantage6 server, registries and the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "node.fullname" . }}-node
  labels:
    {{- include "node.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "node.podSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "node.algorithmSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.port }}
{{- end }}
