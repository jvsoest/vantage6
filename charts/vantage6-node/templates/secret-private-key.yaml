{{- if and .Values.node.encryption.enabled (not .Values.node.encryption.existingSecret.name) }}
{{- if not .Values.node.encryption.privateKey }}
{{- fail "node.encryption.privateKey or node.encryption.existingSecret.name is required when encryption is enabled" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node.privateKeySecretName" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.node.encryption.existingSecret.key }}: |
    {{- .Values.node.encryption.privateKey | nindent 4 }}
{{- end }}
