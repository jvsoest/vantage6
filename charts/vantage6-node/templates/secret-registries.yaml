{{- if .Values.node.registries }}
{{- $auths := dict }}
{{- range .Values.node.registries }}
{{- $_ := set $auths .registry (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc)) }}
{{- end }}
# Pull secret for algorithm images, created from node.registries
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node.registrySecretName" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" $auths | toJson | b64enc }}
{{- end }}
